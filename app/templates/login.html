{% extends "base.html" %}
{% block title %}Вход · GamePulse{% endblock %}
{% block content %}<div class="login-wrap"><div class="panel login-panel"><div class="eyebrow">GAMEPULSE / SIGN IN</div><h1>С возвращением.</h1><p class="muted">Войдите, чтобы открыть библиотеку и мониторинг.</p><form action="/login" method="post"><input type="hidden" name="csrf" value="{{ challenge }}"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required maxlength="100" autofocus><label for="password">Пароль</label><input id="password" type="password" name="password" autocomplete="current-password" required maxlength="1024">{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}<button type="submit">Войти →</button></form></div></div>{% endblock %}
