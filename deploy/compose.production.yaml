x-app: &app
  image: ${GAMEPULSE_IMAGE:?Release image is required}
  env_file: /opt/gamepulse/.env
  environment:
    DATABASE_URL: postgresql+psycopg://gamepulse:${POSTGRES_PASSWORD:?Set database password}@db:5432/gamepulse
  restart: unless-stopped
  volumes:
    - media_data:/service/data
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gamepulse
      POSTGRES_DB: gamepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gamepulse -d gamepulse']
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    <<: *app
    # Only the host proxy can reach the published loopback port.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '*']
    ports: ['127.0.0.1:18000:8000']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    <<: *app
    command: [python, -m, app.jobs]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
