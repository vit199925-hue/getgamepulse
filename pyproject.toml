[project]
name = "gamepulse"
version = "0.1.0"
description = "Metacritic ingestion and evidence-based game review analysis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5",
  "pydantic-settings>=2.8,<3", "jinja2>=3.1,<4",
  "youtube-transcript-api>=1.2,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
audio = ["yt-dlp>=2025.1", "faster-whisper>=1.1,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "static/covers/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
